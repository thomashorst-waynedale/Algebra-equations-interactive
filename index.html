<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ohio Algebra 1 - Kinetic Skill Web</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Playpen+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --slate: #1e293b; --mint: #059669; --crimson: #dc2626; --royal: #2563eb;
  --parchment: #fdfdfb; --grid-dot: #cbd5e1; --bg: #f1f5f9; --card-border: #1e293b;
  --board-bg: #1e293b; --board-grid: #334155; --board-text: #f8fafc; --hover-bg: #e2e8f0; --muted: #64748b;
  --node-support: #3b82f6; --node-fluency: #10b981; --node-rigor: #8b5cf6;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --slate: #f8fafc; --mint: #34d399; --crimson: #f87171; --royal: #60a5fa; --parchment: #0f172a;
    --grid-dot: #334155; --bg: #020617; --card-border: #475569; --board-bg: #0b0f19; --board-grid: #1e293b; --hover-bg: #1e293b; --muted: #94a3b8;
  }
}
:root[data-theme="dark"] {
  --slate: #f8fafc; --mint: #34d399; --crimson: #f87171; --royal: #60a5fa; --parchment: #0f172a;
  --grid-dot: #334155; --bg: #020617; --card-border: #475569; --board-bg: #0b0f19; --board-grid: #1e293b; --hover-bg: #1e293b; --muted: #94a3b8;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  background-color: var(--bg); font-family: 'Playpen Sans', cursive, sans-serif; margin: 0; padding: 20px;
  display: flex; flex-direction: column; align-items: center; transition: background-color .3s ease;
  min-height: 100vh; color: var(--slate);
}
header { text-align: center; margin-bottom: 20px; max-width: 1000px; width: 100%; }
header h1 { font-family: 'Permanent Marker', cursive; font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 5px; }
header p { color: var(--muted); font-size: 1.05rem; margin: 0; }
.layout-container { display: grid; grid-template-columns: 420px 1fr; gap: 30px; max-width: 1400px; width: 100%; }
@media (max-width: 950px) { .layout-container { grid-template-columns: 1fr; } .web-container { height: 440px !important; } }
.sidebar {
  background-color: var(--parchment); background-image: radial-gradient(var(--grid-dot) 1.5px, transparent 1.5px);
  background-size: 20px 20px; border: 4px solid var(--card-border); border-radius: 16px;
  box-shadow: 6px 6px 0 rgba(30,41,59,.1); position: relative; overflow: hidden; display: flex; flex-direction: column;
}
.sidebar-header { padding: 15px; border-bottom: 3px dashed var(--slate); background: var(--parchment); z-index: 2; }
.sidebar-header h2 { font-family: 'Permanent Marker', cursive; margin: 0; font-size: 1.3rem; text-align: center; }
.web-legend { display: flex; justify-content: center; gap: 10px; margin-top: 8px; font-size: .8rem; font-weight: bold; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--slate); }
.web-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; position: relative; height: 720px; }
.web-svg { width: 100%; height: 1400px; display: block; }
.web-link { stroke: var(--slate); stroke-width: 3; stroke-dasharray: 6; opacity: .25; transition: opacity .3s ease, stroke .3s ease; }
.web-link.lit { opacity: .95; stroke: var(--royal); stroke-width: 4; }
.web-node-group { cursor: pointer; transition: transform .2s ease; transform-box: fill-box; transform-origin: center; }
.web-node-group:hover { transform: scale(1.05); }
.web-node-group:focus { outline: none; }
.web-node-group:focus-visible .web-node { stroke: var(--royal); stroke-width: 6; }
.web-node { stroke: var(--slate); stroke-width: 3; transition: all .2s ease; }
.web-node-group.active .web-node { stroke: var(--parchment); stroke-width: 5; filter: drop-shadow(0 0 8px var(--slate)); }
.web-node-label { font-family: 'Playpen Sans', cursive; font-weight: bold; font-size: 13px; fill: var(--slate); text-anchor: middle; pointer-events: none; }
.web-node-title { font-family: 'Permanent Marker', cursive; font-size: 14px; fill: var(--slate); text-anchor: middle; pointer-events: none; }
.web-node-num { font-family: 'Permanent Marker', cursive; font-size: 16px; fill: #fff; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.workspace { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.whiteboard-card {
  background-color: var(--parchment); background-image: radial-gradient(var(--grid-dot) 1.5px, transparent 1.5px);
  background-size: 24px 24px; border: 4px solid var(--card-border); border-radius: 16px;
  box-shadow: 8px 8px 0 rgba(30,41,59,.1); padding: 25px; display: flex; flex-direction: column;
}
.whiteboard-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 3px dashed var(--slate); padding-bottom: 12px; margin-bottom: 8px; }
.whiteboard-title { font-family: 'Permanent Marker', cursive; font-size: 1.5rem; margin: 0; }
.whiteboard-std { background-color: var(--slate); color: var(--bg); padding: 4px 10px; border-radius: 6px; font-size: .85rem; font-weight: bold; }
.stage-path { font-size: .88rem; color: var(--muted); margin-bottom: 14px; min-height: 1.2em; }
.stage-path b { color: var(--slate); }
.canvas-container {
  background-color: var(--board-bg); border-radius: 12px; border: 3px solid var(--slate); position: relative;
  overflow: hidden; width: 100%; aspect-ratio: 2 / 1; box-shadow: inset 0 0 20px rgba(0,0,0,.3);
}
.canvas-container::before {
  content: ''; position: absolute; inset: 0; background-image: radial-gradient(var(--board-grid) 1px, transparent 1px);
  background-size: 20px 20px; pointer-events: none; opacity: .4;
}
.interactive-svg { width: 100%; height: 100%; position: relative; z-index: 1; display: block; fill: var(--board-text); }
.svg-board-text { font-family: 'Playpen Sans', cursive; font-weight: bold; font-size: 34px; text-anchor: middle; dominant-baseline: middle; }
.svg-marker-text { font-family: 'Permanent Marker', cursive; font-size: 28px; text-anchor: middle; dominant-baseline: middle; }
.eb { font-family: 'Playpen Sans', cursive, sans-serif; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.em { font-family: 'Permanent Marker', cursive; text-anchor: middle; dominant-baseline: middle; }
.controls-card {
  background-color: var(--parchment); border: 4px solid var(--card-border); border-radius: 16px; padding: 20px;
  box-shadow: 6px 6px 0 rgba(30,41,59,.1); display: flex; flex-direction: column; gap: 15px;
}
.slider-row { display: flex; align-items: center; gap: 15px; width: 100%; }
.play-btn {
  background-color: var(--mint); color: #fff; border: 3px solid var(--card-border); border-radius: 12px; width: 54px; height: 54px;
  font-size: 1.5rem; cursor: pointer; box-shadow: 3px 3px 0 var(--card-border); transition: all .1s ease;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.play-btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--card-border); }
.play-btn:focus-visible, .util-btn:focus-visible, .step-label:focus-visible { outline: 3px solid var(--royal); outline-offset: 2px; }
.slider-wrapper { flex-grow: 1; position: relative; padding: 10px 0; }
.scrub-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 6px; background: #cbd5e1; outline: none; border: 3px solid var(--slate); cursor: pointer; }
.scrub-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--mint); border: 3px solid var(--slate); cursor: pointer; box-shadow: 0 4px 0 var(--slate); transition: transform .1s ease; }
.scrub-slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--mint); border: 3px solid var(--slate); cursor: pointer; }
.scrub-slider::-webkit-slider-thumb:hover { transform: scale(1.1); }
.step-indicators { display: flex; justify-content: space-between; width: 100%; padding: 0 4px; gap: 2px; }
.step-label { font-family: 'Permanent Marker', cursive; font-size: .95rem; color: var(--muted); text-align: center; flex: 1; transition: color .2s ease, transform .2s ease; cursor: pointer; background: none; border: 0; padding: 2px 0; }
.step-label.active { color: var(--mint); transform: scale(1.1); }
.live-explanation {
  background-color: rgba(37,99,235,.06); border-left: 5px solid var(--royal); padding: 15px; font-size: 1rem;
  border-radius: 0 8px 8px 0; color: var(--slate); font-weight: bold; line-height: 1.5; min-height: 78px;
}
.hint { font-size: .82rem; color: var(--muted); text-align: center; }
.top-utilities { display: flex; gap: 15px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
.util-btn {
  padding: 8px 16px; font-family: 'Permanent Marker', cursive; font-size: 1rem; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--card-border); background-color: var(--parchment); color: var(--slate); box-shadow: 3px 3px 0 var(--slate); transition: all .1s ease;
}
.util-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--slate); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Algebra 1 Progression Web</h1>
  <p>Explore the map. Numbers generate fresh every time you click a node!</p>
</header>

<div class="top-utilities">
  <button class="util-btn" onclick="toggleDarkMode()">🌓 Toggle theme</button>
  <button class="util-btn" onclick="regenerateCurrentNode()">🎲 Generate new numbers</button>
</div>

<div class="layout-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Knowledge Web</h2>
      <div class="web-legend">
        <div class="legend-item"><div class="dot" style="background: var(--node-support)"></div> Foundations</div>
        <div class="legend-item"><div class="dot" style="background: var(--node-fluency)"></div> Fluency</div>
        <div class="legend-item"><div class="dot" style="background: var(--node-rigor)"></div> Rigor</div>
      </div>
    </div>
    <div class="web-container" id="web-container">
      <svg class="web-svg" id="web-svg" viewBox="0 0 400 1400"></svg>
    </div>
  </aside>

  <div class="workspace" id="workspace">
    <div class="whiteboard-card">
      <div class="whiteboard-header">
        <h2 class="whiteboard-title" id="stage-title">Select a node from the map...</h2>
        <span class="whiteboard-std" id="stage-module">Loading...</span>
      </div>
      <div class="stage-path" id="stage-path"></div>
      <div class="canvas-container">
        <svg class="interactive-svg" id="math-svg" viewBox="0 0 800 400"></svg>
      </div>
    </div>

    <div class="controls-card">
      <div class="slider-row">
        <button class="play-btn" id="play-trigger" onclick="togglePlay()" aria-label="Play">▶</button>
        <div class="slider-wrapper">
          <input type="range" class="scrub-slider" id="scrubber" min="0" max="1" step="0.01" value="0" oninput="scrubUpdate()" aria-label="Scrub through the steps">
        </div>
      </div>
      <div class="step-indicators" id="step-indicators"></div>
      <div class="live-explanation" id="explanation-text">Click a node on the left to begin.</div>
      <div class="hint">Space = play/pause · ← → = jump a step · click a step number to go straight there</div>
    </div>
  </div>
</div>

<script>
const getP = (t, step) => Math.max(0, Math.min(1, t - step));
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
let activeParams = null;

/* =====================================================================
   ORIGINAL HAND-BUILT TEMPLATES (Foundations) — kept as you wrote them
   ===================================================================== */
const t_oneStepLeap = (p) => (svg, t) => {
  let p1 = getP(t, 0), p2 = getP(t, 1);
  let startX = 320, endX = 540;
  let cx = startX + (endX - startX) * p1;
  let cy = 100 + 95 * p1 - Math.sin(p1 * Math.PI) * 80;
  let moveColor = p.isAdd ? "#f87171" : "#34d399";
  let movingText = cx > 400 ? (p.isAdd ? `- ${p.startVal}` : `+ ${p.startVal}`) : `${p.startSign} ${p.startVal}`;
  let op1 = 1 - p1 * 0.5, op3 = p2;
  return `
    <g opacity="${op1}">
      <text x="240" y="100" class="svg-board-text">${p.v}</text>
      <text x="320" y="100" class="svg-board-text" fill="${moveColor}">${p.startSign} ${p.startVal}</text>
      <text x="400" y="100" class="svg-board-text">=</text>
      <text x="480" y="100" class="svg-board-text">${p.rVal}</text>
    </g>
    <g opacity="${p1 > 0 ? (1 - p2 * 0.5) : 0}">
      <g opacity="${p1}">
        <path d="M 330 120 C 330 185, 480 185, 520 205" fill="none" stroke="${moveColor}" stroke-width="3" stroke-dasharray="5" />
        <text x="240" y="195" class="svg-board-text">${p.v}</text>
        <text x="400" y="195" class="svg-board-text">=</text>
        <text x="480" y="195" class="svg-board-text">${p.rVal}</text>
      </g>
      <text x="${cx}" y="${cy}" class="svg-board-text" fill="${moveColor}">${movingText}</text>
    </g>
    <g opacity="${op3}">
      <line x1="200" y1="250" x2="600" y2="250" stroke="#334155" stroke-dasharray="3" stroke-width="2" />
      <text x="300" y="300" class="svg-board-text">${p.v}</text>
      <text x="400" y="300" class="svg-board-text">=</text>
      <text x="480" y="300" class="svg-board-text" fill="#60a5fa">${p.finalVal}</text>
    </g>`;
};

const t_oneStepMultDiv = (p) => (svg, t) => {
  let p1 = getP(t, 0), p2 = getP(t, 1);
  let startX = p.isMult ? 310 : 320, endX = p.isMult ? 480 : 540;
  let cx = startX + (endX - startX) * p1;
  let cy = p.isMult ? 100 + 115 * p1 - Math.sin(p1 * Math.PI) * 50 : 130 + 65 * p1 - Math.sin(p1 * Math.PI) * 40;
  let color = p.isMult ? "#f87171" : "#34d399";
  let moveText = p.isMult ? p.coeff : (cx > 400 ? `• ${p.coeff}` : p.coeff);
  let setupLeft = p.isMult ?
    `<text x="310" y="100" class="svg-board-text" fill="${color}">${p.coeff}</text><text x="350" y="100" class="svg-board-text">${p.v}</text>` :
    `<text x="320" y="80" class="svg-board-text">${p.v}</text><line x1="290" y1="100" x2="350" y2="100" stroke="#f8fafc" stroke-width="3"/><text x="320" y="130" class="svg-board-text" fill="${color}">${p.coeff}</text>`;
  let rValY = p.isMult ? 195 - 20 * p1 : 195;
  let op1 = 1 - p1 * 0.5, op3 = p2;
  return `
    <g opacity="${op1}">
      ${setupLeft}
      <text x="400" y="100" class="svg-board-text">=</text>
      <text x="480" y="100" class="svg-board-text">${p.rVal}</text>
    </g>
    <g opacity="${p1 > 0 ? (1 - p2 * 0.5) : 0}">
      <g opacity="${p1}">
        <path d="M ${startX} ${p.isMult ? 120 : 140} C ${startX} 180, 440 180, ${p.isMult ? 460 : 510} ${p.isMult ? 210 : 180}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="5" />
        <text x="${p.isMult ? 350 : 320}" y="195" class="svg-board-text">${p.v}</text>
        <text x="400" y="195" class="svg-board-text">=</text>
        <text x="480" y="${rValY}" class="svg-board-text">${p.rVal}</text>
        ${p.isMult ? `<line x1="450" y1="195" x2="510" y2="195" stroke="#f8fafc" stroke-width="3" />` : ''}
      </g>
      <text x="${cx}" y="${cy}" class="svg-board-text" fill="${color}">${moveText}</text>
    </g>
    <g opacity="${op3}">
      <line x1="200" y1="250" x2="600" y2="250" stroke="#334155" stroke-dasharray="3" stroke-width="2" />
      <text x="300" y="300" class="svg-board-text">${p.v}</text>
      <text x="400" y="300" class="svg-board-text">=</text>
      <text x="480" y="300" class="svg-board-text" fill="#60a5fa">${p.finalVal}</text>
    </g>`;
};

const t_twoStep = (p) => (svg, t) => {
  let p1 = getP(t, 0), p2 = getP(t, 1), p3 = getP(t, 2);
  let cx1 = 310 + (540 - 310) * p1;
  let cy1 = 70 + 90 * p1 - Math.sin(p1 * Math.PI) * 70;
  let isAdd = p.moveSign === '+';
  let mText1 = cx1 > 400 ? (isAdd ? `- ${p.moveVal}` : `+ ${p.moveVal}`) : `${p.moveSign} ${p.moveVal}`;
  let color1 = isAdd ? "#f87171" : "#34d399";
  let cx2 = 220 + (490 - 220) * p2;
  let cy2 = 160 + 125 * p2 - Math.sin(p2 * Math.PI) * 50;
  let v = p.v || 'x';
  let op1 = 1 - p1 * 0.5, op4 = p3;
  return `
    <g opacity="${op1}">
      <text x="220" y="70" class="svg-board-text">${p.coeff}${v}</text>
      <text x="310" y="70" class="svg-board-text" fill="${color1}">${p.moveSign} ${p.moveVal}</text>
      <text x="400" y="70" class="svg-board-text">=</text>
      <text x="490" y="70" class="svg-board-text">${p.rightVal}</text>
    </g>
    <g opacity="${p1 > 0 ? (1 - p2 * 0.5) : 0}">
      <g opacity="${p1}">
        <text x="220" y="160" class="svg-board-text">${p.coeff}${v}</text>
        <text x="400" y="160" class="svg-board-text">=</text>
        ${p1 < 1 ? `<text x="490" y="160" class="svg-board-text">${p.rightVal}</text>` : `<text x="490" y="160" class="svg-board-text" fill="#34d399">${p.step1Val}</text>`}
      </g>
      ${p1 < 1 ? `<text x="${cx1}" y="${cy1}" class="svg-board-text" fill="${color1}">${mText1}</text>` : ''}
      ${p2 > 0 && p2 < 1 ? `<text x="${cx2}" y="${cy2}" class="svg-board-text" fill="#60a5fa">${p.coeff}</text>` : ''}
    </g>
    <g opacity="${p2 > 0 ? (1 - p3 * 0.5) : 0}">
      <g opacity="${p2}">
        <line x1="150" y1="210" x2="650" y2="210" stroke="#334155" stroke-dasharray="3" stroke-width="2" />
        <text x="300" y="250" class="svg-board-text">${v}</text>
        <text x="400" y="250" class="svg-board-text">=</text>
        ${p3 < 1 ? `
          <text x="490" y="235" class="svg-board-text">${p.step1Val}</text>
          <line x1="450" y1="250" x2="530" y2="250" stroke="#f8fafc" stroke-width="3" />
          ${p2 === 1 ? `<text x="490" y="285" class="svg-board-text" fill="#60a5fa">${p.coeff}</text>` : ''}
        ` : `<text x="490" y="250" class="svg-board-text" fill="#60a5fa">${p.finalVal}</text>`}
      </g>
    </g>
    <g opacity="${op4}">
      <line x1="150" y1="300" x2="650" y2="300" stroke="#334155" stroke-dasharray="3" stroke-width="2" />
      <text x="300" y="340" class="svg-board-text">${v}</text>
      <text x="400" y="340" class="svg-board-text">=</text>
      <text x="490" y="340" class="svg-board-text" fill="#60a5fa">${p.finalVal}</text>
    </g>`;
};

/* =====================================================================
   STEP ENGINE — each problem is a list of "lines" on the whiteboard.
   Tokens with matching ids fly from one line to the next, so students
   see exactly which piece moved, merged, cancelled, or flipped.
   ===================================================================== */
const C = { W: '#f8fafc', G: '#34d399', R: '#f87171', B: '#60a5fa', A: '#fbbf24', P: '#c4b5fd', D: '#94a3b8' };
const MN = '−';
const num = n => n < 0 ? MN + Math.abs(n) : String(n);
const sg = n => n < 0 ? `${MN} ${Math.abs(n)}` : `+ ${n}`;
const cx_ = (a, v = 'x') => a === 1 ? v : a === -1 ? MN + v : num(a) + v;
const sgx = (a, v = 'x') => (a < 0 ? `${MN} ` : '+ ') + (Math.abs(a) === 1 ? v : Math.abs(a) + v);
const par = n => n < 0 ? `(${num(n)})` : String(n);
const pr = n => `(${num(n)})`;
const rndNZ = (lo, hi) => { let v; do { v = rnd(lo, hi); } while (v === 0); return v; };
const pick = arr => arr[rnd(0, arr.length - 1)];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcmOf = (a, b) => a * b / gcd(a, b);
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = v => v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const T = (id, t, o = {}) => ({ id, t: String(t), ...o });
const F = (id, n, d, o = {}) => ({ id, frac: { n: String(n), d: String(d) }, ...o });
const EQ = (id = 'eq', t = '=', o = {}) => ({ id, t, rel: true, ...o });
const L = (say, toks, via = null, o = {}) => ({ kind: 'eq', say, toks, via, ...o });
const N = (say, text, via = null, o = {}) => ({ kind: 'note', say, text, via, ...o });
const NL = (say, spec, via = null) => ({ kind: 'numberline', say, spec, via });
const GR = (say, spec, via = null) => ({ kind: 'graph', say, spec, via });
const checkNote = text => N('Check: substitute the answer into the ORIGINAL equation. Both sides match, so the answer is right!', text, null, { c: C.G });

const mctx = document.createElement('canvas').getContext('2d');
const tw = (text, size = 34, mk = false) => { mctx.font = mk ? `${size}px "Permanent Marker", cursive` : `700 ${size}px "Playpen Sans", sans-serif`; return mctx.measureText(text).width; };
const tokW = tok => tok.frac ? Math.max(tw(tok.frac.n, 28), tw(tok.frac.d, 28)) + 14 : tw(tok.t, tok.sz || 34, tok.mk);

function layout(ln) {
  const toks = ln.toks, ws = toks.map(tokW);
  const xs = []; let cur = 0;
  toks.forEach((tk, i) => {
    if (i > 0) cur += tk.tg !== undefined ? tk.tg : ((tk.rel || toks[i - 1].rel) ? 22 : 14);
    xs.push(cur); cur += ws[i];
  });
  const total = cur;
  const ri = ln.align === 'center' ? -1 : toks.findIndex(t => t.rel);
  let shift = ri >= 0 ? 400 - (xs[ri] + ws[ri] / 2) : 400 - total / 2;
  if (xs[0] + shift < 24) shift += 24 - (xs[0] + shift);
  if (total + shift > 776) shift -= total + shift - 776;
  const pos = {};
  toks.forEach((tk, i) => { pos[tk.id] = { x: xs[i] + shift + ws[i] / 2, w: ws[i], tok: tk }; });
  let Lc = null, Rc = null;
  if (ri >= 0) {
    if (ri > 0) Lc = (xs[0] + xs[ri - 1] + ws[ri - 1]) / 2 + shift;
    if (ri < toks.length - 1) Rc = (xs[ri + 1] + total) / 2 + shift;
  }
  return { pos, L: Lc, R: Rc, hasFrac: toks.some(t => t.frac) };
}

function wrap(text, max = 50) {
  const out = [];
  String(text).split('\n').forEach(para => {
    let cur = '';
    para.split(' ').forEach(w => {
      if ((cur + ' ' + w).trim().length > max) { if (cur) out.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) out.push(cur);
  });
  return out;
}

function halfOf(ln, lay) {
  if (ln.kind === 'eq') return lay.hasFrac ? 42 : 26;
  if (ln.kind === 'note') return ln._wrap.length * 14 + 4;
  if (ln.kind === 'numberline') return 44;
  if (ln.kind === 'graph') return (ln.spec.h || 190) / 2;
  return 26;
}

function findPos(E, i, ref) {
  const id = typeof ref === 'string' ? ref : ref.id;
  const part = typeof ref === 'string' ? null : (ref.part || null);
  if (/^op\d+$/.test(id)) { const o = E.ops[i] && E.ops[i][id]; return o ? { ...o, part: null } : null; }
  for (let j = i - 1; j >= 0; j--) {
    const lay = E.lay[j];
    if (lay && lay.pos[id]) return { ...lay.pos[id], y: E.y[j], part };
  }
  return null;
}
const srcXY = s => ({ x: s.x, y: s.part === 'n' ? s.y - 20 : s.part === 'd' ? s.y + 23 : s.y });

function prepare(lines) {
  const E = { lines, lay: [], half: [], y: [], ops: [], yOps: [] };
  lines.forEach((ln, i) => {
    if (ln.kind === 'eq') E.lay[i] = layout(ln);
    if (ln.kind === 'note') ln._wrap = wrap(ln.text);
    E.half[i] = halfOf(ln, E.lay[i]);
  });
  const arcAbove = i => { const nx = lines[i + 1]; return nx && nx.via && nx.via.arrows && nx.via.arrows.some(a => a.style !== 'line') ? 30 : 0; };
  E.y[0] = 16 + E.half[0] + arcAbove(0);
  E.ops[0] = {};
  for (let i = 1; i < lines.length; i++) {
    const via = lines[i].via || {};
    const hasOps = via.ops && via.ops.length;
    E.yOps[i] = E.y[i - 1] + E.half[i - 1] + 22;
    E.y[i] = E.y[i - 1] + E.half[i - 1] + 24 + (hasOps ? 40 : 0) + (via.rule ? 10 : 0) + arcAbove(i) + E.half[i];
    E.ops[i] = {};
    if (hasOps) {
      const pl = E.lay[i - 1];
      via.ops.forEach((o, k) => {
        let x = 400;
        if (o.at === 'L' && pl && pl.L !== null) x = pl.L;
        else if (o.at === 'R' && pl && pl.R !== null) x = pl.R;
        else if (o.at && o.at !== 'ALL' && o.at !== 'L' && o.at !== 'R') { const fp = findPos(E, i, o.at); if (fp) x = fp.x; }
        const tok = { t: o.t, c: o.c || C.R, sz: 26 };
        E.ops[i]['op' + k] = { x, y: E.yOps[i], w: tokW(tok), tok };
      });
    }
  }
  return E;
}

function drawTok(tok, x, y, op = 1) {
  if (op <= 0.001) return '';
  const c = tok.c || C.W;
  if (tok.frac) {
    const w = tokW(tok) - 8;
    return `<g opacity="${op.toFixed(3)}"><text x="${x}" y="${y - 20}" class="eb" style="font-size:28px" fill="${c}">${esc(tok.frac.n)}</text><line x1="${x - w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><text x="${x}" y="${y + 23}" class="eb" style="font-size:28px" fill="${tok.dc || c}">${esc(tok.frac.d)}</text></g>`;
  }
  return `<text x="${x}" y="${y}" class="${tok.mk ? 'em' : 'eb'}" style="font-size:${tok.sz || 34}px" fill="${c}" opacity="${op.toFixed(3)}">${esc(tok.t)}</text>`;
}
function drawPart(src, x, y, op) {
  if (src.part && src.tok.frac) {
    const t = src.part === 'n' ? src.tok.frac.n : src.tok.frac.d;
    const c = src.part === 'd' ? (src.tok.dc || src.tok.c || C.W) : (src.tok.c || C.W);
    return `<text x="${x}" y="${y}" class="eb" style="font-size:28px" fill="${c}" opacity="${op.toFixed(3)}">${esc(t)}</text>`;
  }
  return drawTok(src.tok, x, y, op);
}
const sameTok = (a, b) => a.frac ? !!(b.frac && a.frac.n === b.frac.n && a.frac.d === b.frac.d) : (!b.frac && a.t === b.t);

function drawNumberLine(sp, y, prog, op) {
  const x0 = 120, x1 = 680, px = v => x0 + (v - sp.min) / (sp.max - sp.min) * (x1 - x0);
  let s = `<g opacity="${op}">`;
  s += `<line x1="${x0 - 30}" y1="${y}" x2="${x1 + 30}" y2="${y}" stroke="${C.D}" stroke-width="3"/>`;
  s += `<path d="M ${x0 - 40} ${y} l 12 -7 v 14 z" fill="${C.D}"/><path d="M ${x1 + 40} ${y} l -12 -7 v 14 z" fill="${C.D}"/>`;
  for (let v = sp.min; v <= sp.max; v++) {
    const x = px(v);
    s += `<line x1="${x}" y1="${y - 8}" x2="${x}" y2="${y + 8}" stroke="${C.D}" stroke-width="2"/><text x="${x}" y="${y + 27}" class="eb" style="font-size:16px" fill="${v === 0 ? C.W : C.D}">${esc(num(v))}</text>`;
  }
  if (sp.shade) {
    const pv = px(sp.pts[0].v), end = sp.shade === 'left' ? x0 - 30 : x1 + 30, cur = lerp(pv, end, prog);
    s += `<line x1="${pv}" y1="${y}" x2="${cur}" y2="${y}" stroke="${C.G}" stroke-width="9" stroke-linecap="round" opacity="0.85"/>`;
    if (prog > 0.95) { const d = sp.shade === 'left' ? -1 : 1; s += `<path d="M ${end + d * 14} ${y} l ${-d * 16} -11 v 22 z" fill="${C.G}"/>`; }
  }
  const po = clamp01(prog * 2);
  sp.pts.forEach(p => {
    const x = px(p.v);
    s += `<circle cx="${x}" cy="${y}" r="11" stroke="${C.G}" stroke-width="4" ${p.open ? 'style="fill:var(--board-bg)"' : `fill="${C.G}"`} opacity="${po}"/>`;
    if (p.label) s += `<text x="${x}" y="${y - 28}" class="eb" style="font-size:19px" fill="${C.G}" opacity="${po}">${esc(p.label)}</text>`;
  });
  return s + '</g>';
}

const niceStep = r => r <= 20 ? 1 : r <= 40 ? 2 : 5;
function drawGraph(sp, yc, prog, op, uid) {
  const W = 420, H = (sp.h || 190) - 14, gx = 400 - W / 2, gy = yc - H / 2;
  const [xa, xb] = sp.xr, [ya, yb] = sp.yr;
  const X = v => gx + (v - xa) / (xb - xa) * W, Y = v => gy + (yb - v) / (yb - ya) * H;
  let s = `<g opacity="${op}"><defs><clipPath id="${uid}"><rect x="${gx}" y="${gy}" width="${W}" height="${H}" rx="8"/></clipPath></defs>`;
  s += `<rect x="${gx}" y="${gy}" width="${W}" height="${H}" rx="8" fill="#0f172a" fill-opacity="0.65" stroke="#475569" stroke-width="2"/>`;
  s += `<g clip-path="url(#${uid})">`;
  const xs = niceStep(xb - xa), ys = niceStep(yb - ya);
  for (let v = Math.ceil(xa / xs) * xs; v <= xb; v += xs) s += `<line x1="${X(v)}" y1="${gy}" x2="${X(v)}" y2="${gy + H}" stroke="#334155" stroke-width="1"/>`;
  for (let v = Math.ceil(ya / ys) * ys; v <= yb; v += ys) s += `<line x1="${gx}" y1="${Y(v)}" x2="${gx + W}" y2="${Y(v)}" stroke="#334155" stroke-width="1"/>`;
  if (xa < 0 && xb > 0) s += `<line x1="${X(0)}" y1="${gy}" x2="${X(0)}" y2="${gy + H}" stroke="${C.D}" stroke-width="2"/>`;
  if (ya < 0 && yb > 0) s += `<line x1="${gx}" y1="${Y(0)}" x2="${gx + W}" y2="${Y(0)}" stroke="${C.D}" stroke-width="2"/>`;
  (sp.fns || []).forEach(fn => {
    let d = '';
    for (let k = 0; k <= 160; k++) {
      const x = xa + (xb - xa) * k / 160;
      const yv = Math.max(ya - 60, Math.min(yb + 60, fn.f(x)));
      d += (k ? ' L ' : 'M ') + X(x).toFixed(1) + ' ' + Y(yv).toFixed(1);
    }
    if (fn.dash) s += `<path d="${d}" fill="none" stroke="${fn.c}" stroke-width="4" stroke-dasharray="10 10" opacity="${prog}"/>`;
    else s += `<path d="${d}" fill="none" stroke="${fn.c}" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1 - prog).toFixed(3)}"/>`;
  });
  if (sp.tri && prog > 0.5) {
    const t = sp.tri, o2 = clamp01((prog - 0.5) * 2);
    s += `<path d="M ${X(t.x)} ${Y(t.y)} H ${X(t.x + t.run)} V ${Y(t.y + t.rise)}" fill="none" stroke="${C.A}" stroke-width="3" stroke-dasharray="6 5" opacity="${o2}"/>`;
    s += `<text x="${X(t.x + t.run / 2)}" y="${Y(t.y) + (t.rise > 0 ? 16 : -14)}" class="eb" style="font-size:15px" fill="${C.A}" opacity="${o2}">run ${t.run}</text>`;
    s += `<text x="${X(t.x + t.run) + 8}" y="${Y(t.y + t.rise / 2)}" class="eb" style="font-size:15px;text-anchor:start" fill="${C.A}" opacity="${o2}">rise ${num(t.rise)}</text>`;
  }
  s += '</g>';
  (sp.pts || []).forEach(p => {
    const o2 = clamp01((prog - 0.6) / 0.4), x = X(p.x), y = Y(p.y), right = x > gx + W - 110;
    s += `<circle cx="${x}" cy="${y}" r="7" fill="${p.c || C.W}" stroke="#0f172a" stroke-width="2" opacity="${o2}"/>`;
    s += `<text x="${right ? x - 12 : x + 12}" y="${y - 16}" class="eb" style="font-size:17px;text-anchor:${right ? 'end' : 'start'}" fill="${p.c || C.W}" opacity="${o2}">${esc(p.label)}</text>`;
  });
  (sp.fns || []).forEach((fn, k) => {
    if (fn.label) s += `<text x="${gx + 10}" y="${gy + 16 + k * 20}" class="eb" style="font-size:15px;text-anchor:start" fill="${fn.c}">${esc(fn.label)}</text>`;
  });
  return s + '</g>';
}

function drawLine(E, i, op, prog = 1) {
  const ln = E.lines[i], y = E.y[i];
  if (ln.kind === 'eq') return ln.toks.map(tk => drawTok(tk, E.lay[i].pos[tk.id].x, y, op)).join('');
  if (ln.kind === 'note') {
    const rows = ln._wrap, top = y - (rows.length - 1) * 14;
    return rows.map((r, k) => `<text x="400" y="${top + k * 28}" class="eb" style="font-size:22px" fill="${ln.c || '#e2e8f0'}" opacity="${op}">${esc(r)}</text>`).join('');
  }
  if (ln.kind === 'numberline') return drawNumberLine(ln.spec, y, prog, op);
  if (ln.kind === 'graph') return drawGraph(ln.spec, y, prog, op, 'gclip' + i);
  return '';
}

const MK = { [C.G]: 'mkG', [C.R]: 'mkR', [C.B]: 'mkB', [C.A]: 'mkA' };
function drawDecor(E, i, pa, pc, op, live) {
  const via = E.lines[i].via;
  if (!via) return '';
  let s = '';
  if (live && via.hl) via.hl.forEach(h => h.ids.forEach(id => {
    const p = findPos(E, i, id); if (!p) return;
    const hh = p.tok.frac ? 44 : 24;
    s += `<rect x="${p.x - p.w / 2 - 8}" y="${p.y - hh}" width="${p.w + 16}" height="${hh * 2}" rx="10" fill="${h.c}" fill-opacity="0.15" stroke="${h.c}" stroke-width="2.5" opacity="${pa}"/>`;
  }));
  if (via.rule) { const yy = E.y[i - 1] + E.half[i - 1] + 12; s += `<line x1="180" y1="${yy}" x2="620" y2="${yy}" stroke="${C.D}" stroke-width="3" opacity="${pa * op}"/>`; }
  if (via.arrows) via.arrows.forEach(ar => {
    const a = findPos(E, i, { id: ar.f, part: ar.fp }), b = findPos(E, i, { id: ar.t, part: ar.tp });
    if (!a || !b) return;
    const c = ar.c || C.G;
    let d;
    if (ar.style === 'line') {
      const p1 = srcXY(a), p2 = srcXY(b), dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1, k = 22 / len;
      d = `M ${p1.x + dx * k} ${p1.y + dy * k} L ${p2.x - dx * k} ${p2.y - dy * k}`;
    } else {
      const ta = a.y - (a.tok.frac ? 44 : 26), tb = b.y - (b.tok.frac ? 44 : 26);
      d = `M ${a.x} ${ta} Q ${(a.x + b.x) / 2} ${Math.min(ta, tb) - 38} ${b.x} ${tb}`;
    }
    s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="3" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1 - pa).toFixed(3)}" opacity="${op}" ${pa > 0.9 ? `marker-end="url(#${MK[c] || 'mkG'})"` : ''}/>`;
  });
  Object.values(E.ops[i] || {}).forEach(o => { s += drawTok(o.tok, o.x, o.y, pa * op); });
  if (via.cancel && pc > 0) via.cancel.forEach(id => {
    const p = findPos(E, i, id); if (!p) return;
    const hw = p.w / 2 + 5, hh = p.tok.frac ? 30 : (p.tok.sz ? 14 : 17);
    const x1 = p.x - hw, y1 = p.y + hh, x2 = lerp(x1, p.x + hw, pc), y2 = lerp(y1, p.y - hh, pc);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.R}" stroke-width="4" stroke-linecap="round" opacity="${op}"/>`;
  });
  return s;
}

function drawIncoming(E, i, m) {
  const ln = E.lines[i];
  if (ln.kind !== 'eq') return drawLine(E, i, clamp01(m * 1.5), m);
  if (m <= 0) return '';
  const y = E.y[i]; let s = '';
  const late = clamp01((m - 0.55) / 0.45);
  ln.toks.forEach(tk => {
    const dst = E.lay[i].pos[tk.id];
    const srcs = tk.from ? tk.from.map(r => findPos(E, i, r)).filter(Boolean) : (tk.fresh ? [] : [findPos(E, i, tk.id)].filter(Boolean));
    if (!srcs.length) { s += drawTok(tk, dst.x, y + 12 * (1 - m), m); return; }
    const same = srcs.length === 1 && !srcs[0].part && sameTok(srcs[0].tok, tk);
    const spin = tk.spin && srcs.length === 1;
    srcs.forEach(src => {
      const p0 = srcXY(src), dx = dst.x - p0.x;
      const arc = Math.abs(dx) > 30 ? Math.min(60, Math.abs(dx) * 0.3) : 0;
      const gx = lerp(p0.x, dst.x, m), gy = lerp(p0.y, y, m) - Math.sin(m * Math.PI) * arc;
      if (same) s += drawTok(tk, gx, gy, 1);
      else if (spin) {
        const sx = Math.cos(m * Math.PI), t2 = sx >= 0 ? src.tok : tk;
        s += `<g transform="translate(${gx} ${gy}) scale(${Math.max(0.03, Math.abs(sx)).toFixed(3)} 1)">${drawTok(t2, 0, 0, 1)}</g>`;
      } else s += drawPart(src, gx, gy, 1 - late);
    });
    if (!same && !spin) s += drawTok(tk, dst.x, y, late);
  });
  return s;
}

function renderEngine(E, t) {
  const n = E.lines.length - 1;
  const s = Math.min(n, Math.floor(t + 1e-6));
  const f = s >= n ? 0 : t - s;
  const pa = clamp01(f / 0.3), pc = clamp01((f - 0.12) / 0.3), m = ease(clamp01((f - 0.35) / 0.6));
  const bottom = i => E.y[i] + E.half[i];
  const fb = s < n ? lerp(bottom(s), bottom(s + 1), ease(clamp01((f - 0.15) / 0.7))) : bottom(s);
  const off = Math.max(0, fb - 386);
  let out = '';
  for (let i = 0; i <= s; i++) {
    const op = i < s ? 0.45 : (s < n ? 1 - 0.5 * m : 1);
    out += drawLine(E, i, op, 1);
    if (i >= 1) out += drawDecor(E, i, 1, 1, 0.5, false);
  }
  if (s < n) { out += drawDecor(E, s + 1, pa, pc, 1, true); out += drawIncoming(E, s + 1, m); }
  return `<g transform="translate(0 ${(-off).toFixed(1)})">${out}</g>`;
}

const DEFS = `<defs>${Object.entries(MK).map(([c, id]) => `<marker id="${id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${c}"/></marker>`).join('')}</defs>`;

    render: (svg, t, p) => t_twoStep(p)(svg, t) },

  /* ---------------- FLUENCY ---------------- */
  { id: 'n5', x: 200, y: 300, diff: 2, title: 'Combine Terms', label: '🟧x + 🟩 + 🔺x = 🔵', mod: 'A.REI.3',
    generate: () => { const ans = rnd(2, 8), a = rnd(2, 6), c = rnd(1, 5), b = rndNZ(-9, 12), k = a + c; return { ans, a, b, c, k, d: k * ans + b }; },

  links.forEach(l => {
    const s = nodes.find(n => n.id === l[0]), t = nodes.find(n => n.id === l[1]);
    if (s && t) content += `<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" class="web-link" data-a="${l[0]}" data-b="${l[1]}"></line>`;
  });
  nodes.forEach((n, i) => {
    const color = n.diff === 1 ? 'var(--node-support)' : (n.diff === 2 ? 'var(--node-fluency)' : 'var(--node-rigor)');
    content += `
      <g class="web-node-group" id="group-${n.id}" onclick="selectNode('${n.id}', true)" tabindex="0" role="button" aria-label="${n.title}"
         onkeydown="if(event.key==='Enter'){selectNode('${n.id}', true)}">
        <circle cx="${n.x}" cy="${n.y}" r="28" class="web-node" fill="${color}"></circle>
        <text x="${n.x}" y="${n.y + 1}" class="web-node-num">${i + 1}</text>
        <text x="${n.x}" y="${n.y + 45}" class="web-node-title">${n.title}</text>
        <text x="${n.x}" y="${n.y + 62}" class="web-node-label">${n.label}</text>
      </g>`;
  });
  svg.innerHTML = content;
}

function stopPlay() {
  clearInterval(autoplayInterval); isPlaying = false;
  const b = document.getElementById('play-trigger'); b.innerText = '▶'; b.setAttribute('aria-label', 'Play');
}

function selectNode(id, fromUser = false) {
  stopPlay();
  selectedNodeId = id;
  const node = nodes.find(n => n.id === id);
  document.querySelectorAll('.web-node-group').forEach(g => g.classList.remove('active'));
  document.getElementById(`group-${id}`).classList.add('active');
  document.querySelectorAll('.web-link').forEach(l => l.classList.toggle('lit', l.dataset.a === id || l.dataset.b === id));

  activeParams = node.generate();
  if (node.build) { activeEngine = prepare(node.build(activeParams)); activeTips = activeEngine.lines.map(l => l.say); }
  else { activeEngine = null; activeTips = node.tips(activeParams); }

  document.getElementById('stage-title').innerText = node.title;
  document.getElementById('stage-module').innerText = `Ohio Standard: ${node.mod}`;
  const title = nid => nodes.find(n => n.id === nid).title;
  const pre = links.filter(l => l[1] === id).map(l => title(l[0]));
  const nxt = links.filter(l => l[0] === id).map(l => title(l[1]));
  document.getElementById('stage-path').innerHTML =
    (pre.length ? `<b>Builds on:</b> ${pre.join(', ')}` : '<b>Starting point</b>') +
    (nxt.length ? ` &nbsp;·&nbsp; <b>Leads to:</b> ${nxt.join(', ')}` : ' &nbsp;·&nbsp; <b>Top of the web!</b>');

  const scrubber = document.getElementById('scrubber');
  scrubber.max = activeTips.length - 1;
  scrubber.value = 0;
  const labels = document.getElementById('step-indicators');
  labels.innerHTML = '';
  activeTips.forEach((tip, i) => {
    const b = document.createElement('button');
    b.className = 'step-label'; b.id = 'label-' + i;
    b.innerText = activeTips.length > 6 ? `${i + 1}` : `Step ${i + 1}`;
    b.onclick = () => { stopPlay(); scrubber.value = i; scrubUpdate(); };
    labels.appendChild(b);
  });
  scrubUpdate();
  if (fromUser && window.innerWidth < 950) document.getElementById('workspace').scrollIntoView({ behavior: 'smooth' });
}

function regenerateCurrentNode() { if (selectedNodeId) selectNode(selectedNodeId); }

function scrubUpdate() {
  if (!selectedNodeId || !activeParams) return;
  const val = parseFloat(document.getElementById('scrubber').value);
  const node = nodes.find(n => n.id === selectedNodeId);
  const maxStep = activeTips.length - 1;
  const base = Math.min(maxStep, Math.floor(val + 1e-6));
  const idx = (val - base > 0.02 && base < maxStep) ? base + 1 : base;
  document.getElementById('explanation-text').innerText = activeTips[idx];
  for (let i = 0; i <= maxStep; i++) {
    const el = document.getElementById('label-' + i);
    if (el) el.classList.toggle('active', Math.abs(val - i) < 0.5);
  }
  const svg = document.getElementById('math-svg');
  svg.innerHTML = DEFS + (activeEngine ? renderEngine(activeEngine, val) : node.render(svg, val, activeParams));
}

function togglePlay() {
  if (!selectedNodeId) return;
  const playBtn = document.getElementById('play-trigger');
  const scrubber = document.getElementById('scrubber');
  const maxVal = parseFloat(scrubber.max);
  if (isPlaying) { stopPlay(); return; }
  playBtn.innerText = '⏸'; playBtn.setAttribute('aria-label', 'Pause'); isPlaying = true;
  if (parseFloat(scrubber.value) >= maxVal) scrubber.value = 0;
  let hold = 0;
  autoplayInterval = setInterval(() => {
    if (hold > 0) { hold--; return; }
    const prev = parseFloat(scrubber.value);
    let val = prev + 0.016;
    if (Math.floor(val + 1e-6) > Math.floor(prev + 1e-6)) { val = Math.round(val); hold = 26; }
    if (val >= maxVal) { val = maxVal; stopPlay(); }
    scrubber.value = val;
    scrubUpdate();
  }, 25);
}

function toggleDarkMode() {
  const root = document.documentElement;
  const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = isDark ? 'light' : 'dark';
}

document.addEventListener('keydown', e => {
  if (!selectedNodeId || e.target.closest('.web-node-group')) return;
  const sc = document.getElementById('scrubber'), v = parseFloat(sc.value), mx = parseFloat(sc.max);
  if (e.key === 'ArrowRight') { e.preventDefault(); stopPlay(); sc.value = Math.min(mx, Math.floor(v + 1e-6) + 1); scrubUpdate(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); sc.value = Math.max(0, Math.ceil(v - 1e-6) - 1); scrubUpdate(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); togglePlay(); }
});

window.onload = () => {
  drawWeb();
  selectNode('n1a');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    if (activeEngine) { activeEngine = prepare(activeEngine.lines); scrubUpdate(); }
  });
};
</script>
</body>
